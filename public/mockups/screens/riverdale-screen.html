<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=390, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 390px; height: 844px; overflow: hidden; }
      body {
        font-family: Outfit, system-ui, sans-serif;
        background: #fff;
        color: #0b1c1f;
      }
      .screen {
        width: 390px;
        height: 844px;
        display: flex;
        flex-direction: column;
        background: #fff;
      }
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 72px 24px 16px;
      }
      .brand {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
      }
      .burger {
        width: 18px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .burger span {
        display: block;
        height: 2px;
        width: 100%;
        background: #0b1c1f;
      }
      .hero {
        margin: 0 24px;
        height: 42%;
        border-radius: 10px;
        overflow: hidden;
      }
      .hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .body {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 22px 28px 32px;
      }
      .kicker {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.16em;
        color: #0f766e;
      }
      .title {
        margin-top: 8px;
        font-family: Fraunces, Georgia, serif;
        font-size: 28px;
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      .copy {
        margin-top: 12px;
        font-size: 14px;
        line-height: 1.5;
        color: #5b6b70;
      }
      .cta-wrap {
        margin-top: auto;
        padding-top: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .cta {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 999px;
        background: #0f766e;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        padding: 14px 18px;
      }
      .link {
        text-align: center;
        font-size: 13px;
        font-weight: 500;
        color: #0f766e;
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="nav">
        <p class="brand">RIVERDALE INTERIORS</p>
        <div class="burger" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>
      <div class="hero">
        <img src="../riverdale-living.jpg" alt="" />
      </div>
      <div class="body">
        <p class="kicker">THOUGHTFUL SPACES</p>
        <h1 class="title">Beautiful interiors. Designed for living.</h1>
        <p class="copy">From first visit to finished rooms, a clear path to book a consult.</p>
        <div class="cta-wrap">
          <div class="cta"><span>☎</span><span>(613) 555-0148</span></div>
          <p class="link">View Our Work →</p>
        </div>
      </div>
    </div>
  </body>
</html>
